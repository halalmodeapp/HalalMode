# Keeps the Android preview app on the latest pushed code.
#
# On every push to the main branch an over-the-air update is published to the
# preview channel; installed apps pick it up on their next launch. Updates are
# labelled with the native code fingerprint (runtimeVersion policy in app.json),
# so an app only receives updates it can run. After a native change (a new
# native package, icons, an Expo upgrade) make a new APK once:
#   npx eas-cli workflow:run .eas/workflows/android-preview-build.yml
name: Android preview update

on:
  push:
    branches: ['codex/premium-foundation']

jobs:
  update:
    type: update
    params:
      platform: android
      branch: preview
