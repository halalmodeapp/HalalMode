<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
<link rel="icon" type="image/png" href="/favicon.png?v=3">
<meta name="robots" content="noindex, nofollow">
<title>Decide in the admin panel · Halal Mode</title>
<style>
  :root { --ink:#0a0a0a; --soft:#6c6a65; --sand:#f2f0ec; --surface:#fcfcfb; }
  body { margin:0; background:var(--surface); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:460px; margin:12vh auto; padding:0 16px; }
  .card { background:var(--sand); border-radius:20px; padding:24px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:var(--soft); margin:0 0 20px; }
  a.button { display:block; text-align:center; border-radius:999px; padding:14px; font:600 15px system-ui, sans-serif; color:#fff; background:var(--ink); text-decoration:none; }
</style>
</head>
<body>
<main>
  <!-- Older report emails linked here with signed Suspend, Ban and Dismiss
       links. Those links no longer act: decisions are made in the admin
       panel, which asks for a two-factor code and logs every action. -->
  <div class="card">
    <h1>Decide in the admin panel</h1>
    <p>Report actions now happen in Reports in the admin panel. It asks for your two-factor code and logs every decision. This email link no longer acts by itself.</p>
    <a class="button" href="/admin#/reports">Open Reports</a>
  </div>
</main>
</body>
</html>
