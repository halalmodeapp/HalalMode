# Local-only Supabase configuration for migrations and pgTAP contracts.
#
# This file intentionally contains no project reference, database password, API
# key, provider secret, or production URL. `supabase start`, `db reset`, and
# `test db` target Docker containers on the developer/CI machine only.
project_id = "halal-mode-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# The contract suite builds every required fixture itself. Keeping seeds off
# makes a reset deterministic and prevents sample data from masking a failure.
enabled = false

[auth]
enabled = true
# Production values: `supabase config push` applies this file to the live
# project, so local addresses are only extra allowed returns, never the default.
site_url = "https://halalmo.de/app"
additional_redirect_urls = ["https://halalmo.de/app", "https://halalmo.de/app/**", "https://*.halalmode.pages.dev/**", "halalmode://**", "exp://127.0.0.1:8081", "http://localhost:8081/**", "http://localhost:8082/**"]
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = false
# One sign-in email per address per minute: stops accidental floods and abuse.
max_frequency = "60s"

[auth.sms]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

[edge_runtime]
enabled = true
policy = "oneshot"

[analytics]
enabled = false

# Both functions are called by pg_cron, which sends a shared secret in a header
# and no JWT. With JWT verification on, the gateway answers 401 before the
# function runs and the job fails silently every night — which is exactly what
# happened to the deletion worker. Each function checks its own secret against
# the vault, so this is written down here rather than left as a deploy flag
# somebody has to remember.
[functions.generate-round]
verify_jwt = false

[functions.finalize-account-deletions]
verify_jwt = false

[functions.send-notifications]
verify_jwt = false

[functions.send-mail]
verify_jwt = false

[functions.report-action]
verify_jwt = false

[functions.moderate]
verify_jwt = false
