name: Quality gates

# Every push, on every branch: the database contracts need a real Postgres,
# which GitHub provides free here, so they never have to run on a laptop.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  client:
    name: Client checks and Android bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_PUBLIC_USE_MOCKS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run verify:client
      - run: npm run export:android

  database-contracts:
    name: Isolated database contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pull Supabase images from the public ECR mirror: anonymous Docker Hub
      # pulls from shared runners hit "toomanyrequests: Rate exceeded".
      SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Start isolated Supabase services
        # The contracts need Postgres, Auth and Storage; skip the services
        # they never touch so there are fewer images to pull.
        run: supabase start -x studio,imgproxy,edge-runtime,postgres-meta

      - name: Reset local database and run pgTAP contracts
        run: supabase db reset --local && supabase test db

      - name: Stop isolated Supabase services
        if: always()
        run: supabase stop

  edge-functions:
    name: Edge Function typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck every function
        run: for f in supabase/functions/*/index.ts; do deno check --node-modules-dir=auto "$f" || exit 1; done
