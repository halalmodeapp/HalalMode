name: Quality gates

# Every push, on every branch: the database contracts need a real Postgres,
# which GitHub provides free here, so they never have to run on a laptop.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  client:
    name: Client checks and Android bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_PUBLIC_USE_MOCKS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.20.2
          cache: npm

      - run: npm ci
      - run: npm run verify:client
      - run: npm run export:android

  database-contracts:
    name: Isolated database contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.110.0

      # Docker Hub limits anonymous pulls, and shared CI machines hit that limit
      # (the database job once failed before running a single test). Signing in
      # lifts it: add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as repository secrets.
      - name: Sign in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          else
            echo "No Docker Hub secrets set; pulling anonymously."
          fi

      # The contracts only need Postgres, auth and storage (the migrations create
      # buckets and policies). Every other service is a download that can hit
      # the registry's anonymous pull limit, so they are not started. A
      # rate-limited pull is still worth another go a little later.
      - name: Start isolated Supabase services
        run: |
          for attempt in 1 2 3; do
            supabase start -x studio,imgproxy,edge-runtime,realtime,mailpit,postgres-meta,vector,supavisor && exit 0
            echo "supabase start failed (attempt $attempt); retrying in 60 seconds"
            supabase stop --no-backup || true
            sleep 60
          done
          exit 1

      - name: Reset local database and run pgTAP contracts
        run: supabase db reset --local && supabase test db

      - name: Stop isolated Supabase services
        if: always()
        run: supabase stop

  edge-functions:
    name: Edge Function typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7

      - name: Typecheck every function
        run: for f in supabase/functions/*/index.ts; do deno check --node-modules-dir=auto "$f" || exit 1; done
